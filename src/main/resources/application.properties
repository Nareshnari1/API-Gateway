spring.application.name=api-gateway-service
server.port=${SERVER_PORT:8083}

# --- Eureka client ---
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# --- Routes: proxy to each downstream service, load-balanced via Eureka.
# No prefix stripping: downstream services serve the same /api/v1/... paths. ---
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/products/**

spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/orders/**

spring.cloud.gateway.server.webflux.routes[2].id=notification-service-notifications
spring.cloud.gateway.server.webflux.routes[2].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.server.webflux.routes[3].id=notification-service-templates
spring.cloud.gateway.server.webflux.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/templates/**

management.endpoints.web.exposure.include=health,gateway

# --- Auth: user accounts DB ---
# Local-only DB credentials also live in application-secrets.properties (git-ignored);
# the env placeholders below take precedence and are what Docker uses.
spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gateway_service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Tech@123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Auth: JWT ---
# app.jwt.secret must be a Base64-encoded key of at least 32 bytes (HS256).
# Override both via env vars for anything beyond local dev.
app.jwt.secret=${JWT_SECRET:c29tZS12ZXJ5LWxvbmctc2VjcmV0LWtleS1mb3ItZGV2LXVzZS1vbmx5LWNoYW5nZS1pbi1wcm9kIQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Auth: dev convenience — include the OTP in the /register response (and logs)
# so registration is testable without real email delivery. Set false in production. ---
app.otp.dev-return=${OTP_DEV_RETURN:true}

# --- Auth: default admin account, seeded on startup if it doesn't exist ---
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:1234}

# --- Auth: default customer account, seeded on startup if it doesn't exist ---
app.customer.email=${CUSTOMER_EMAIL:user@gmail.com}
app.customer.password=${CUSTOMER_PASSWORD:1234}
